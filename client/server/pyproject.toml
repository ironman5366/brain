[project]
name = "eeg-server"
version = "0.1.0"
description = "Real-time EEG streaming server for OpenBCI Cyton"
requires-python = ">=3.13"
dependencies = [
    "brainflow>=5.12.0",
    "pylsl>=1.16.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "msgpack>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "click>=8.1.0",
    "setuptools>=75.0.0,<81",
]

[project.scripts]
eeg-server = "eeg_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
